openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Polymarket Trading API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: markets
    description: Polymarket prediction markets
  - name: positions
    description: User trading positions
  - name: orders
    description: Trade orders
  - name: portfolio
    description: Portfolio summary and stats
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /markets:
    get:
      operationId: listMarkets
      tags: [markets]
      summary: List all markets
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, resolved, all]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of markets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Market"

  /markets/{marketId}:
    get:
      operationId: getMarket
      tags: [markets]
      summary: Get market details
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Market details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"

  /positions:
    get:
      operationId: listPositions
      tags: [positions]
      summary: List user positions
      responses:
        "200":
          description: List of open positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: placeOrder
      tags: [orders]
      summary: Place a new trade order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{orderId}:
    delete:
      operationId: cancelOrder
      tags: [orders]
      summary: Cancel an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /portfolio/summary:
    get:
      operationId: getPortfolioSummary
      tags: [portfolio]
      summary: Get portfolio summary
      responses:
        "200":
          description: Portfolio overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"

  /portfolio/pnl:
    get:
      operationId: getPortfolioPnl
      tags: [portfolio]
      summary: Get P&L history over time
      responses:
        "200":
          description: P&L history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PnlPoint"

  /markets/trending:
    get:
      operationId: getTrendingMarkets
      tags: [markets]
      summary: Get trending markets by volume
      responses:
        "200":
          description: Trending markets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Market"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Market:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [active, resolved, closed]
        yesPrice:
          type: number
          format: float
        noPrice:
          type: number
          format: float
        volume:
          type: number
          format: float
        liquidity:
          type: number
          format: float
        endDate:
          type: string
          format: date-time
        resolvedOutcome:
          type: string
          nullable: true
        description:
          type: string
      required:
        - id
        - question
        - category
        - status
        - yesPrice
        - noPrice
        - volume
        - liquidity
        - endDate

    Position:
      type: object
      properties:
        id:
          type: string
        marketId:
          type: string
        marketQuestion:
          type: string
        side:
          type: string
          enum: [YES, NO]
        shares:
          type: number
        avgPrice:
          type: number
        currentPrice:
          type: number
        pnl:
          type: number
        pnlPercent:
          type: number
        value:
          type: number
      required:
        - id
        - marketId
        - marketQuestion
        - side
        - shares
        - avgPrice
        - currentPrice
        - pnl
        - pnlPercent
        - value

    Order:
      type: object
      properties:
        id:
          type: string
        marketId:
          type: string
        marketQuestion:
          type: string
        side:
          type: string
          enum: [YES, NO]
        type:
          type: string
          enum: [BUY, SELL]
        price:
          type: number
        amount:
          type: number
        shares:
          type: number
        status:
          type: string
          enum: [open, filled, cancelled, partial]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - marketId
        - marketQuestion
        - side
        - type
        - price
        - amount
        - shares
        - status
        - createdAt

    PlaceOrderRequest:
      type: object
      properties:
        marketId:
          type: string
        side:
          type: string
          enum: [YES, NO]
        type:
          type: string
          enum: [BUY, SELL]
        price:
          type: number
        amount:
          type: number
      required:
        - marketId
        - side
        - type
        - price
        - amount

    PortfolioSummary:
      type: object
      properties:
        totalValue:
          type: number
        availableBalance:
          type: number
        investedAmount:
          type: number
        totalPnl:
          type: number
        totalPnlPercent:
          type: number
        openPositions:
          type: integer
        totalTrades:
          type: integer
        winRate:
          type: number
      required:
        - totalValue
        - availableBalance
        - investedAmount
        - totalPnl
        - totalPnlPercent
        - openPositions
        - totalTrades
        - winRate

    PnlPoint:
      type: object
      properties:
        date:
          type: string
        pnl:
          type: number
        cumulative:
          type: number
      required:
        - date
        - pnl
        - cumulative
