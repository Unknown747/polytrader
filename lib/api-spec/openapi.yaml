openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Polymarket Trading API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: markets
  - name: positions
  - name: orders
  - name: portfolio
  - name: strategy
  - name: wallet
  - name: telegram
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /markets:
    get:
      operationId: listMarkets
      tags: [markets]
      summary: List all markets
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, resolved, all]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of markets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Market"

  /markets/trending:
    get:
      operationId: getTrendingMarkets
      tags: [markets]
      summary: Get trending markets by volume
      responses:
        "200":
          description: Trending markets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Market"

  /markets/{marketId}:
    get:
      operationId: getMarket
      tags: [markets]
      summary: Get market details
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Market details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"

  /positions:
    get:
      operationId: listPositions
      tags: [positions]
      summary: List user positions
      responses:
        "200":
          description: List of open positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: placeOrder
      tags: [orders]
      summary: Place a new trade order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{orderId}:
    delete:
      operationId: cancelOrder
      tags: [orders]
      summary: Cancel an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /portfolio/summary:
    get:
      operationId: getPortfolioSummary
      tags: [portfolio]
      summary: Get portfolio summary
      responses:
        "200":
          description: Portfolio overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"

  /portfolio/pnl:
    get:
      operationId: getPortfolioPnl
      tags: [portfolio]
      summary: Get P&L history
      responses:
        "200":
          description: P&L history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PnlPoint"

  /strategy/opportunities:
    get:
      operationId: getOpportunities
      tags: [strategy]
      summary: Get trading opportunities from scanner
      responses:
        "200":
          description: List of opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"

  /strategy/config:
    get:
      operationId: getStrategyConfig
      tags: [strategy]
      summary: Get auto-trading configuration
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyConfig"
    put:
      operationId: updateStrategyConfig
      tags: [strategy]
      summary: Update auto-trading configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyConfig"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyConfig"

  /strategy/backtest:
    post:
      operationId: runBacktest
      tags: [strategy]
      summary: Run strategy backtest on historical data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestRequest"
      responses:
        "200":
          description: Backtest results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"

  /wallet/status:
    get:
      operationId: getWalletStatus
      tags: [wallet]
      summary: Get wallet connection status
      responses:
        "200":
          description: Wallet status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletStatus"

  /telegram/test:
    post:
      operationId: testTelegram
      tags: [telegram]
      summary: Send a test Telegram notification
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramTestResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Market:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [active, resolved, closed]
        yesPrice:
          type: number
        noPrice:
          type: number
        volume:
          type: number
        volume24h:
          type: number
        liquidity:
          type: number
        endDate:
          type: string
          format: date-time
        resolvedOutcome:
          type: string
          nullable: true
        description:
          type: string
        conditionId:
          type: string
        tokenId:
          type: string
      required:
        - id
        - question
        - category
        - status
        - yesPrice
        - noPrice
        - volume
        - volume24h
        - liquidity
        - endDate

    Position:
      type: object
      properties:
        id:
          type: string
        marketId:
          type: string
        marketQuestion:
          type: string
        side:
          type: string
          enum: [YES, NO]
        shares:
          type: number
        avgPrice:
          type: number
        currentPrice:
          type: number
        pnl:
          type: number
        pnlPercent:
          type: number
        value:
          type: number
      required:
        - id
        - marketId
        - marketQuestion
        - side
        - shares
        - avgPrice
        - currentPrice
        - pnl
        - pnlPercent
        - value

    Order:
      type: object
      properties:
        id:
          type: string
        marketId:
          type: string
        marketQuestion:
          type: string
        side:
          type: string
          enum: [YES, NO]
        type:
          type: string
          enum: [BUY, SELL]
        price:
          type: number
        amount:
          type: number
        shares:
          type: number
        status:
          type: string
          enum: [open, filled, cancelled, partial]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - marketId
        - marketQuestion
        - side
        - type
        - price
        - amount
        - shares
        - status
        - createdAt

    PlaceOrderRequest:
      type: object
      properties:
        marketId:
          type: string
        side:
          type: string
          enum: [YES, NO]
        type:
          type: string
          enum: [BUY, SELL]
        price:
          type: number
        amount:
          type: number
      required: [marketId, side, type, price, amount]

    PortfolioSummary:
      type: object
      properties:
        totalValue:
          type: number
        availableBalance:
          type: number
        investedAmount:
          type: number
        totalPnl:
          type: number
        totalPnlPercent:
          type: number
        openPositions:
          type: integer
        totalTrades:
          type: integer
        winRate:
          type: number
      required:
        - totalValue
        - availableBalance
        - investedAmount
        - totalPnl
        - totalPnlPercent
        - openPositions
        - totalTrades
        - winRate

    PnlPoint:
      type: object
      properties:
        date:
          type: string
        pnl:
          type: number
        cumulative:
          type: number
      required: [date, pnl, cumulative]

    Opportunity:
      type: object
      properties:
        marketId:
          type: string
        question:
          type: string
        category:
          type: string
        recommendedSide:
          type: string
          enum: [YES, NO]
        currentPrice:
          type: number
        estimatedFairValue:
          type: number
        edge:
          type: number
        expectedReturn:
          type: number
        kellyFraction:
          type: number
        suggestedAmount:
          type: number
        riskLevel:
          type: string
          enum: [low, medium, high]
        daysToResolution:
          type: number
        volume24h:
          type: number
        rationale:
          type: string
        conditionId:
          type: string
      required:
        - marketId
        - question
        - category
        - recommendedSide
        - currentPrice
        - estimatedFairValue
        - edge
        - expectedReturn
        - kellyFraction
        - suggestedAmount
        - riskLevel
        - daysToResolution
        - volume24h
        - rationale

    StrategyConfig:
      type: object
      properties:
        autoTradingEnabled:
          type: boolean
        bankroll:
          type: number
        maxPositionPct:
          type: number
        minEdge:
          type: number
        minProbability:
          type: number
        maxDaysToResolution:
          type: integer
        minVolume24h:
          type: number
        scanIntervalMinutes:
          type: integer
        telegramAlertsEnabled:
          type: boolean
        maxDailyTrades:
          type: integer
      required:
        - autoTradingEnabled
        - bankroll
        - maxPositionPct
        - minEdge
        - minProbability
        - maxDaysToResolution
        - minVolume24h
        - scanIntervalMinutes
        - telegramAlertsEnabled
        - maxDailyTrades

    BacktestRequest:
      type: object
      properties:
        daysBack:
          type: integer
        bankroll:
          type: number
        minProbability:
          type: number
        maxDaysToResolution:
          type: integer
        maxPositionPct:
          type: number
      required: [daysBack, bankroll, minProbability, maxDaysToResolution, maxPositionPct]

    BacktestResult:
      type: object
      properties:
        totalReturn:
          type: number
        totalReturnPct:
          type: number
        winRate:
          type: number
        totalTrades:
          type: integer
        winningTrades:
          type: integer
        losingTrades:
          type: integer
        avgReturn:
          type: number
        maxDrawdown:
          type: number
        sharpeRatio:
          type: number
        trades:
          type: array
          items:
            $ref: "#/components/schemas/BacktestTrade"
        equityCurve:
          type: array
          items:
            $ref: "#/components/schemas/PnlPoint"
      required:
        - totalReturn
        - totalReturnPct
        - winRate
        - totalTrades
        - winningTrades
        - losingTrades
        - avgReturn
        - maxDrawdown
        - sharpeRatio
        - trades
        - equityCurve

    BacktestTrade:
      type: object
      properties:
        date:
          type: string
        question:
          type: string
        side:
          type: string
          enum: [YES, NO]
        entryPrice:
          type: number
        exitPrice:
          type: number
        amount:
          type: number
        pnl:
          type: number
        pnlPct:
          type: number
        outcome:
          type: string
          enum: [win, loss]
      required:
        - date
        - question
        - side
        - entryPrice
        - exitPrice
        - amount
        - pnl
        - pnlPct
        - outcome

    WalletStatus:
      type: object
      properties:
        connected:
          type: boolean
        address:
          type: string
          nullable: true
        usdcBalance:
          type: number
        hasApiCredentials:
          type: boolean
        network:
          type: string
        dataSource:
          type: string
          enum: [live, demo]
        telegramConfigured:
          type: boolean
      required:
        - connected
        - address
        - usdcBalance
        - hasApiCredentials
        - network
        - dataSource
        - telegramConfigured

    TelegramTestResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]
