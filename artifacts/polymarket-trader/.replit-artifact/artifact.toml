kind = "web"
previewPath = "/"
title = "Polymarket Trader"
version = "1.0.0"
id = "artifacts/polymarket-trader"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23789

[services.development]
run = "pnpm --filter @workspace/polymarket-trader run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/polymarket-trader", "run", "build" ]
publicDir = "artifacts/polymarket-trader/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23789"
BASE_PATH = "/"
